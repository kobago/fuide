[package]
name = "fuide-git"
description = "Git client with a Sci-Fi FUI look, built on egui (drives the git CLI)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "fuide-git"
path = "src/main.rs"

[dependencies]
egui = { workspace = true }
eframe = { workspace = true }
fuide = { workspace = true }
chrono = "0.4"

[dev-dependencies]
# end-to-end tests: the whole eframe app driven through the accessibility tree (`src/app/e2e.rs`)
egui_kittest = { version = "0.36.1", features = ["eframe"] }

# `cargo bundle --release --format dmg -p fuide-git` (see scripts/release.sh)
[package.metadata.bundle]
name = "FUIDE Git"
identifier = "fuide.git"
short_description = "Git client with a Sci-Fi FUI look"
# paths are resolved from the directory `cargo bundle` runs in (workspace root; see scripts/release.sh)
icon = ["assets/icons/git.svg"]
category = "public.app-category.developer-tools"
copyright = "Copyright (c) 2026 Go Kobayashi"
osx_minimum_system_version = "13.0"
