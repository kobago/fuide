[package]
name = "fuide"
description = "FUI Develop Environment: Futuristic UI theme, window shell, dialogs and instrument widgets for egui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
egui = { workspace = true }
log = "0.4"
# MCP (JSON-RPC) messages for the agent interface
serde_json = "1"

[dev-dependencies]
# UI tests: accessibility-tree queries + wgpu-rendered snapshots (`tests/`)
egui_kittest = { version = "0.36.1", features = ["wgpu", "snapshot"] }
